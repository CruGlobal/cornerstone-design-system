ruleDirs:
  - rules
testConfigs:
  - testDir: rule-tests
# Component stylesheets are CSS inside a `css` tagged template in a .ts file. Parsing that
# region as CSS lets a rule match the exact `var(...)` call, so the finding lands on the
# added line rather than on the first line of the whole template.
languageInjections:
  - hostLanguage: ts
    rule:
      pattern: css`$CONTENT`
    injected: css
