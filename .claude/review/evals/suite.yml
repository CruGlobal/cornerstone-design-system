version: 1
name: cornerstone-review-gate
# Visible development set. Keep a separate private holdout so rule and prompt
# edits cannot overfit to every expected answer here. Each seeded patch applies
# to the head this suite was written against (a6cc039); re-base the hunks when
# the files they touch move.
blocker_threshold: 7
thresholds:
  blocker_recall: 0.85
  blocker_precision: 0.80
  clean_false_blocker_rate: 0.05
  false_positive_dismissal_rate: 0.20
  category_recall: 0.70
  minimum_runs: 50
cases:
  - id: a11y-ssr-axe-early-return
    kind: seeded_bug
    category: accessibility
    # Adds an early return under the SSR fixture to the button's per-variant axe
    # test, so the hydrated half of the suite passes while asserting nothing (the
    # UIUX-119 shape).
    patch: patches/a11y-ssr-axe-early-return.patch
    expected:
      - id: ssr-branch-asserts-nothing
        must_block: true
        min_severity: 7
        category: accessibility
        match:
          paths: ['packages/components/src/components/button/**']
          categories: [accessibility, testing]
          message_any: [ssr, hydrated, 'return', asserts nothing, early return, axe]

  - id: api-csspart-rename-under-patch
    kind: seeded_bug
    category: api-surface
    # Renames cs-badge's public `start` part to `prefix` (JSDoc and render agree,
    # so test:parts passes) under a `patch` changeset. cs-badge is @status stable.
    patch: patches/api-csspart-rename-under-patch.patch
    expected:
      - id: breaking-part-rename-not-major
        must_block: true
        min_severity: 7
        category: api-surface
        match:
          paths: ['packages/components/src/components/badge/**', '.changeset/**']
          categories: [api-surface, standards, breaking-change]
          message_any: [part, rename, breaking, major, semver, stable]

  - id: tokens-global-retune
    kind: seeded_bug
    category: tokens-and-theming
    # Darkens `_sys.color.primary.default` in cru-light to fix one component's
    # indicator contrast. The right fix was the narrow `primary-strong` role (#54).
    patch: patches/tokens-global-retune.patch
    expected:
      - id: global-retune-for-one-context
        must_block: false
        min_severity: 5
        category: tokens-and-theming
        match:
          paths: ['packages/tokens/tokens/sys/**']
          categories: [tokens-and-theming, accessibility]
          message_any: [primary-strong, scoped, global, every consumer, retune, alias]

  - id: theming-load-bearing-literal
    kind: seeded_bug
    category: api-surface
    # Changes cs-tag's height multiplier without touching cs-select's matching
    # padding; the two sum to one control height and nothing names the pair.
    patch: patches/theming-load-bearing-literal.patch
    expected:
      - id: unread-reader-of-literal
        must_block: false
        min_severity: 5
        category: api-surface
        match:
          paths: ['packages/components/src/components/tag/**']
          categories: [api-surface, architecture]
          message_any: [select, form-control-height, load-bearing, reader, sum, '0.1']

  - id: styles-foreign-token-vocabulary
    kind: seeded_bug
    category: tokens-and-theming
    # Binds cs-divider to a `--sys-*` name from the token package, which never
    # resolves in a component stylesheet. The static rule fires at error.
    patch: patches/styles-foreign-token-vocabulary.patch
    expected:
      - id: foreign-vocabulary
        must_block: true
        min_severity: 7
        category: tokens-and-theming
        match:
          paths: ['packages/components/src/components/divider/**']
          categories: [tokens-and-theming, static, api-surface]
          message_any: ['--sys', '--cs-', vocabulary, never resolve, token package]

  - id: docs-hand-written-api-table
    kind: seeded_bug
    category: docs-and-skills
    # Adds a hand-written Properties table to a component page whose API reference
    # remark-component-api.js already renders from the manifest.
    patch: patches/docs-hand-written-api-table.patch
    expected:
      - id: hand-maintained-generated-content
        must_block: false
        min_severity: 4
        category: docs-and-skills
        match:
          paths: ['packages/docs/src/content/docs/components/**']
          categories: [docs-and-skills]
          message_any: [generated, manifest, remark-component-api, drift, hand-written, duplicate]

  - id: standards-extends-litelement
    kind: seeded_bug
    category: standards
    # Switches cs-badge to extend LitElement with `static styles`, dropping the host
    # styles, ElementInternals and SSR wiring the base class provides. Two static
    # rules fire.
    patch: patches/standards-extends-litelement.patch
    expected:
      - id: bare-litelement
        must_block: true
        min_severity: 7
        category: standards
        match:
          paths: ['packages/components/src/components/badge/**']
          categories: [standards, architecture, static]
          message_any: [LitElement, CornerstoneElement, base class, 'static css', host styles]

  - id: testing-focused-test
    kind: seeded_bug
    category: testing
    # Leaves a `describe.only` in cs-badge's test, so CI runs one block and reports green.
    patch: patches/testing-focused-test.patch
    expected:
      - id: focused-test-committed
        must_block: true
        min_severity: 7
        category: testing
        match:
          paths: ['packages/components/src/components/badge/**']
          categories: [testing, static]
          message_any: ['.only', focused, skips]

  - id: clean-rename-local
    kind: clean_control
    # Behavior-preserving: renames a local in the base class's style-attribute
    # builder. Touches a CRITICAL-tier file, so it measures whether high risk
    # alone provokes a false blocker.
    patch: patches/clean-rename-local.patch
    expected: []

  - id: clean-extract-helper
    kind: clean_control
    # Behavior-preserving: hoists `noNegativeZero` to module scope in src/internal/math.ts.
    patch: patches/clean-extract-helper.patch
    expected: []
