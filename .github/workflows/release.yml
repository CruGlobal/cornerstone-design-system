name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write
  actions: write # to start CI on the release pull request

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm install -g npm@latest
      - run: node -v && npm -v
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - uses: changesets/action@v1
        id: changesets
        with:
          publish: npm run release
          version: npm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The release pull request is opened and pushed with GITHUB_TOKEN, which starts no workflow, so it
      # would never report `CI gate`. A dispatch is the one event that token can start.
      - name: Run CI on the release pull request
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --ref changeset-release/main
