name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches: [main]` filter here meant a PR based
  # on another feature branch — a stacked PR — ran no CI at all, rather than
  # running it and failing. Push stays filtered to main so a branch with an
  # open PR doesn't build twice.
  pull_request:

# One run per ref. A second push used to leave the first still going, and the component gate holds
# six runners for several minutes each — two of them competing for the same runners is how a suite
# starts failing on timeouts rather than assertions. `cancel-in-progress` is safe here because nothing in this
# workflow deploys or publishes; the worst a cancelled run loses is a result we no longer want.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What changed decides what runs. The component suite drives three real browsers on six runners for
  # several minutes each; a change to a documentation page has no way to affect it, and paying for it anyway
  # is how a gate stops being run.
  #
  # The rules are not in this file. `packages/build-tools/affected.js` holds them, with a test for each, and
  # every job below reads one field of what it prints: `if: fromJSON(needs.changes.outputs.gates).docs`. A
  # new rule about what a change reaches is a line and a test there, not an edit here.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      gates: ${{ steps.affected.outputs.gates }}
      playwright: ${{ steps.affected.outputs.playwright }}
    steps:
      # Two commits deep, for the diff. A pull request's checkout is GitHub's merge commit, whose first
      # parent is the base branch, so `HEAD^1` is exactly what this change is measured against. On a push
      # it is the commit `main` pointed at before.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
      # No `npm ci`: the module imports nothing outside Node. If git cannot produce the diff, it opens
      # every gate instead of failing.
      - name: Decide which gates this change reaches
        id: affected
        # Named, because the default shell runs without `pipefail` and `tee` would hide a failure.
        shell: bash
        env:
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: node packages/build-tools/affected.js --base "$BASE" | tee -a "$GITHUB_OUTPUT"

  # One job for the token package: lint the tree, build it, then load the built `./mui` export under
  # plain Node ESM, the way a non-TypeScript consumer would. These are the three commands the package's
  # README gives a developer, in the same order.
  verify-tokens:
    name: Verify tokens
    needs: changes
    if: fromJSON(needs.changes.outputs.gates).tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run validate --workspace @cruglobal/cornerstone-design-system
      # Tokens only. The component build runs inside `verify-components-static`, and running the root
      # build here would do it twice per PR.
      - run: npm run build --workspace @cruglobal/cornerstone-design-system
      - run: npm test --workspace @cruglobal/cornerstone-design-system

  # `npm run verify` used to be one job, on the principle that CI should run exactly the command a
  # developer runs and nothing else. Sharding the browser suite breaks that into two — so the split lives
  # in `package.json` as `verify:static` and `test`, both of which a developer can still run, rather than
  # as a list of steps in this file. `npm run verify` is still `verify:static && test`, so the local gate
  # and the CI gate remain the same thing.
  verify-components-static:
    name: Verify components (static)
    needs: changes
    if: fromJSON(needs.changes.outputs.gates).components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Everything in `verify` that is not the browser suite: prettier, build, eslint, cspell, tsc and the
      # file checks. Once, rather than repeated on each of the shards below.
      - run: npm run verify:static --workspace @cruglobal/cornerstone-components

  # The browser suite, in sixths.
  #
  # It was ~28 minutes as one job, and almost all of that is serial: `concurrency` in
  # web-test-runner.config.js resolves to 1 on a 4-core runner, so each engine walks the test files one page
  # at a time, and the three engines already run in parallel with one another. Splitting by *engine* would
  # therefore buy close to nothing — the file list is the only axis with parallelism left in it.
  #
  # The run is as slow as its slowest shard, so the files are dealt by measured cost, not by count:
  # `scripts/test-selection.js` in the components package, weighted by its `test-durations.json`. Dealt
  # round robin, one shard could take twice as long as another, and the gate waited on the slow one.
  #
  # The shard count is written once, as the length of `matrix.shard`; the job name and `WTR_SHARD` read
  # `strategy.job-total`.
  #
  # Short shards also thin the failure mode CLAUDE.md records, where WebKit stops being able to open pages
  # near the end of a long run: no shard has a long tail any more.
  #
  # `fail-fast: false` because a failure in one shard says nothing about the others, and cancelling
  # them turns one red test into five unknowns.
  verify-components-test:
    name: Verify components (tests ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: changes
    if: fromJSON(needs.changes.outputs.gates).browser
    runs-on: ubuntu-latest
    # Playwright's own image already holds this version's three browsers and the ~130 apt packages they
    # need. Installing those packages on a bare runner is what made a shard slow: 26-46s from a quick
    # Ubuntu mirror, 34-42 minutes from a slow one, and once a hang cancelled at 207 minutes, against
    # 4-9 minutes of tests. The tag must match the `playwright` version the packages pin; a
    # mismatch fails at launch ("Executable doesn't exist"), not by testing the wrong browsers. So the tag
    # is read from the lockfile by the `changes` job and is written nowhere in this file.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.changes.outputs.playwright }}-noble
      # Firefox won't start as root when HOME belongs to another user, as it does in a job container.
      # `--ipc=host` is Playwright's advice for Chromium, which can run out of shared memory without it.
      options: --user 1001 --ipc=host
    # A shard is meant to take a few minutes. Past thirty it is stuck, and waiting longer only holds the runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # The suite loads components from `dist/`, and nothing is shared between runners, so each shard
      # builds the library for itself. Seconds, against the tens of minutes the shard saves.
      - run: npm run build --workspace @cruglobal/cornerstone-components
      - name: Run this shard of the suite
        env:
          WTR_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm test --workspace @cruglobal/cornerstone-components

  verify-docs:
    name: Verify documentation
    needs: changes
    if: fromJSON(needs.changes.outputs.gates).docs
    # Pinned, not `ubuntu-latest`. That label moved to Ubuntu 26.04, where Playwright 1.55.1 refuses to
    # install Chromium ("does not support chromium on ubuntu26.04-x64"). A cached browser hid that until
    # the cache key changed. Move this when a Playwright bump supports the newer image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # `check:a11y` opens each Inspiration Screen in Chromium to run axe on it, and needs no other engine.
      # The cache is keyed on what decides which Chromium build is downloaded: the Playwright version the
      # `changes` job read from the lockfile, and the runner's image and architecture. It was keyed on the
      # whole lockfile, so every dependency bump missed it and spent three minutes downloading a browser
      # that had not changed.
      #
      # Not the Playwright image the shards run in. That was tried, locally, and `test:a11y` failed in it on
      # each of three runs: axe flagged two more elements in the needs-review fixture than it does here
      # (UIUX-330). The runner pin above comes off with a Playwright bump (UIUX-329).
      - name: Read the runner image
        id: runner
        run: echo "image=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.runner.outputs.image }}-${{ runner.arch }}-${{ needs.changes.outputs.playwright }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The apt packages `--with-deps` installs live outside the cached directory, as in the suite's job.
      - name: Install Playwright Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # The shared build modules' own tests, including the changelog sorter the docs page reads from.
      # Seconds, and the `docs` gate already opens for every path they cover.
      - run: npm run verify --workspace @cruglobal/cornerstone-build-tools
      # The site reads the library's manifest and copies its bundled build, so the library has to be
      # built — but not tested. That is the whole saving: minutes instead of half an hour.
      - run: npm run build --workspace @cruglobal/cornerstone-components
      # Most of the agent skill is generated from the docs pages, so a docs-only change can break the skill
      # the package ships. A docs-only change never runs the static gate, the only other place this check
      # runs, so it runs here too. The library was built a line up, so it scans the real output in a second.
      - run: npm run verify:skills --workspace @cruglobal/cornerstone-components
      - run: npm run verify --workspace cornerstone-docs-site

  # Whether this pull request carries the changeset it owes. The rule is CLAUDE.md's Changeset Rules, written
  # as `packages/build-tools/changeset-gate.js` with a test per clause. The install is for
  # `@changesets/parse`: the gate reads each changeset with the parser the release uses, so a file it passes
  # is one `changeset version` can read.
  #
  # `gates.changeset` is false on a push and on the release pull request, which exists to consume changesets.
  # It is true for Dependabot: most of its pull requests owe nothing, and the script says which do.
  changeset:
    name: Changeset present
    needs: changes
    if: fromJSON(needs.changes.outputs.gates).changeset
    runs-on: ubuntu-latest
    steps:
      # The merge commit and its parents. `HEAD^1` is the pull request's own base, not a hardcoded main:
      # on a stacked pull request, comparing against main counted every changeset in the stack, so one
      # that added none of its own still passed on an ancestor's.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - name: Require a changeset for this PR's own diff
        run: node packages/build-tools/changeset-gate.js --base HEAD^1

  # The one check `main`'s branch protection names (cru-terraform, github/CruGlobal/repos/
  # cornerstone-design-system). Requiring this job instead of each job above means a renamed job or
  # a different shard count never blocks `main` until Terraform catches up. A skipped job passes the
  # gate on purpose: `affected.js` skips suites a change cannot affect, and GitHub counts a skipped
  # required check as passed anyway.
  gate:
    name: CI gate
    needs:
      - changes
      - verify-tokens
      - verify-components-static
      - verify-components-test
      - verify-docs
      - changeset
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
