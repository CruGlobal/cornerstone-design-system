name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered. A `branches: [main]` filter here meant a PR based
  # on another feature branch — a stacked PR — ran no CI at all, rather than
  # running it and failing. Push stays filtered to main so a branch with an
  # open PR doesn't build twice.
  pull_request:

# One run per ref. A second push used to leave the first still going, and the component gate is
# ~35 minutes — two of them competing for the same runners is how a suite starts failing on
# timeouts rather than assertions. `cancel-in-progress` is safe here because nothing in this
# workflow deploys or publishes; the worst a cancelled run loses is a result we no longer want.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-tokens:
    name: Validate tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run validate --workspace @cruglobal/cornerstone-design-system

  build:
    name: Build tokens
    needs: validate-tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Tokens only. The component build runs inside `verify-components`, and running the
      # root build here would do it twice per PR.
      - run: npm run build --workspace @cruglobal/cornerstone-design-system

  # What changed decides what runs. The component suite drives three real browsers and takes ~35
  # minutes; a change to a documentation page has no way to affect it, and paying for it anyway is
  # how a gate stops being run.
  #
  # The dependency is one-directional and the filters mirror it: the documentation site consumes the
  # library, so a components change runs both gates — but a docs-only change runs only its own.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      components: ${{ steps.filter.outputs.components }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            components:
              - 'packages/components/**'
              - 'packages/build-tools/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'packages/docs/**'
              - 'packages/components/**'
              - 'packages/build-tools/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  verify-components:
    name: Verify components
    needs: changes
    if: needs.changes.outputs.components == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # `npm run verify` is what a developer runs by hand, so CI runs exactly that and nothing else —
      # one command, no bespoke job graph to drift from the local check. All three engines.
      - run: npx playwright install --with-deps
      - run: npm run verify --workspace @cruglobal/cornerstone-components

  verify-docs:
    name: Verify documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # The site reads the library's manifest and copies its bundled build, so the library has to be
      # built — but not tested. That is the whole saving: minutes instead of half an hour.
      - run: npm run build --workspace @cruglobal/cornerstone-components
      - run: npm run verify --workspace cornerstone-docs-site

  changeset:
    name: Changeset present
    # Skip the changeset gate for automated maintenance PRs (e.g. Dependabot)
    # and the Changesets release PR — none of these touch the token API.
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref != 'changeset-release/main' &&
      !startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      # Compare against the PR's own base, not a hardcoded main. On a stacked
      # PR, --since=origin/main counts every changeset in the whole stack, so a
      # PR that added none of its own still passed on an ancestor's. BASE_REF
      # goes through env rather than inline interpolation because git allows
      # `$` and `;` in ref names, which would otherwise be a shell-injection
      # surface.
      - name: Require a changeset for this PR's own diff
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          npx changeset status --since="origin/$BASE_REF"
