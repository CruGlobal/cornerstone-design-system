# Dependabot has been opening pull requests here without a config. This adds one, so that it scans one
# directory, not several. This is an npm workspace, and scanning the root covers every package — without
# it, the same dependency gets a pull request per package it appears in.
#
# A Playwright bump needs one more edit than Dependabot makes: the container image tag in
# `.github/workflows/ci.yml` has to move to the same version, or the test shards launch browsers that do
# not match the package.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
