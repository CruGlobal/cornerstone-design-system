# Dependabot has been opening pull requests here without a config. This adds one, so that it scans one
# directory, not several. This is an npm workspace, and scanning the root covers every package — without
# it, the same dependency gets a pull request per package it appears in.
#
# A Playwright bump needs no edit beyond the one Dependabot makes. The container image the test shards
# run in takes its tag from the lockfile: `packages/build-tools/affected.js` reads the resolved `playwright`
# version in CI's `changes` job, and `.github/workflows/ci.yml` builds the image name from it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
