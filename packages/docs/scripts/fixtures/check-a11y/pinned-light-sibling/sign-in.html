<!doctype html>
<!--
  The clean sign-in test Screen pinned to light by a wrapper that has an empty sibling, for check-a11y.test.js.
  Never built into the site. The empty `#overlays` mount is the kind of sibling a real Screen has (a portal, a
  toast mount, an SVG sprite), and it must not hide the pin: every line of text still renders light, so the
  check runs it light only and passes.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <div class="cs-light" style="background: var(--cs-color-surface-default)">
      <main class="cs-stack">
        <h1>Sign in</h1>
        <p style="color: #333333">Use the email you signed up with.</p>
        <form class="cs-stack">
          <cs-input label="Email" type="email" name="email"></cs-input>
          <cs-input label="Password" type="password" name="password"></cs-input>
          <cs-button type="submit" variant="brand">Sign in</cs-button>
        </form>
      </main>
    </div>
    <div id="overlays"></div>
  </body>
</html>
