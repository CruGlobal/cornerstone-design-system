<!doctype html>
<!--
  A test Screen that renders the other scheme in both runs, for check-a11y.test.js. Never built into the site.
  Its <body> is `cs-dark`, so the light run renders dark; when the check turns on dark mode, a script swaps it to
  `cs-light`, so the dark run renders light. Each run alone looks pinned and would be skipped, which would leave
  the Screen with no run at all. The check must fail that rather than pass a page axe never saw.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
    <script>
      new MutationObserver(() => {
        if (document.documentElement.classList.contains('cs-dark')) {
          document.body.classList.replace('cs-dark', 'cs-light');
        }
      }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
    </script>
  </head>
  <body class="cs-dark">
    <main class="cs-stack">
      <h1>Sign in</h1>
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
