<!doctype html>
<!--
  The clean sign-in test Screen with one line of text fixed to a dark grey, for check-a11y.test.js. Never built
  into the site. On the light page background it passes; on the dark one it fails color-contrast, which proves
  the dark run renders the page dark rather than repeating the light run.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <main class="cs-stack">
      <h1>Sign in</h1>
      <p class="fixed-ink" style="color: #333333">Use the email you signed up with.</p>
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
