<!doctype html>
<!--
  The clean sign-in test Screen with an image path holding a stray `%`, for check-a11y.test.js. Never built
  into the site. `50%.png` is not a valid escape, so decoding it throws; the check must answer it with a 404,
  as a static host would, rather than crash.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <main class="cs-stack">
      <h1>Sign in</h1>
      <img src="50%.png" alt="Half done" width="32" height="32" />
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
