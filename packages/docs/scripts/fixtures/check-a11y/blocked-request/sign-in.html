<!doctype html>
<!--
  The clean sign-in test Screen with an image its own Content Security Policy blocks, for check-a11y.test.js.
  Never built into the site. Chromium fails the request with no response at all, so it is not a 404, but the
  image still never shows. The check must fail it and say why.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="img-src 'none'" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <main class="cs-stack">
      <h1>Sign in</h1>
      <img src="../../../../favicon.svg" alt="Cornerstone" width="32" height="32" />
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
