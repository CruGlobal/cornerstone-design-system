<!doctype html>
<!--
  The clean sign-in test Screen with a stylesheet path that leaves out the site's base path, for
  check-a11y.test.js. Never built into the site. `/dist/...` is on the docs host but outside the site, so on
  Pages it is a 404 and the Screen renders without that stylesheet. The check must fail it in both modes.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <style>
      @import url('/dist/styles/themes/fl.css');
    </style>
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <main class="cs-stack">
      <h1>Sign in</h1>
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
