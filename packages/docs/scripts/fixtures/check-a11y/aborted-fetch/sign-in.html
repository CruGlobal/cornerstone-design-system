<!doctype html>
<!--
  The clean sign-in test Screen that starts a fetch and cancels it, for check-a11y.test.js. Never built into
  the site. Cancelling a request on purpose is normal (a component dropping a stale fetch, an image swapping its
  src), and Chromium reports it as a failure with `net::ERR_ABORTED`. The check must not fail the Screen for it.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
    <script>
      const controller = new AbortController();

      fetch('../../../../dist/cornerstone.js', { signal: controller.signal }).catch(() => {});
      setTimeout(() => controller.abort(), 0);
    </script>
  </head>
  <body>
    <main class="cs-stack">
      <h1>Sign in</h1>
      <form class="cs-stack">
        <cs-input label="Email" type="email" name="email"></cs-input>
        <cs-input label="Password" type="password" name="password"></cs-input>
        <cs-button type="submit" variant="brand">Sign in</cs-button>
      </form>
    </main>
  </body>
</html>
