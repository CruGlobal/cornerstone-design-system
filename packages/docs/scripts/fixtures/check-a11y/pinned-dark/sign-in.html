<!doctype html>
<!--
  The clean sign-in test Screen pinned to dark by its one top-level wrapper, for check-a11y.test.js. Never
  built into the site. Its fixed dark-grey text fails contrast on the dark page, so the dark run fails; the
  light run is never made. The wrapper paints its own background because `cs-dark` sets the colour roles on a
  plain <div> but does not paint it; without that, its light text would sit on the white page.
-->
<html lang="en" class="cs-cloak">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in</title>
    <link rel="stylesheet" href="../../../../dist/styles/themes/default.css" />
    <link rel="stylesheet" href="../../../../dist/styles/cornerstone.css" />
    <script type="module" src="../../../../dist/cornerstone.loader.js"></script>
  </head>
  <body>
    <div class="cs-dark" style="background: var(--cs-color-surface-default)">
      <main class="cs-stack">
        <h1>Sign in</h1>
        <p style="color: #333333">Use the email you signed up with.</p>
        <form class="cs-stack">
          <cs-input label="Email" type="email" name="email"></cs-input>
          <cs-input label="Password" type="password" name="password"></cs-input>
          <cs-button type="submit" variant="brand">Sign in</cs-button>
        </form>
      </main>
    </div>
  </body>
</html>
