id: no-static-styles
language: TypeScript
severity: warning
message: Declare component styles on `static css`, not `static styles`.
note: >-
  `CornerstoneElement` defines `static get styles()` to prepend the shared host styles to whatever
  `static css` holds. A component that assigns `static styles` itself replaces that getter and drops
  the host styles. See packages/components/CLAUDE.md.
files:
  - 'src/components/**/*.ts'
rule:
  pattern:
    context: 'class A { static styles = $VALUE }'
    selector: public_field_definition
